services:
  backpipe:
    user: "1000:1000"
    image: reaktivnii/backpipe:latest
    container_name: backpipe
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command: -s -i /input -o /output -c /app/config.cfg
    cpus: '4.0'
    mem_limit: 10g
    mem_reservation: 4g
    volumes:
      - ./input:/input
      - ./output:/output
    restart: unless-stopped
    tty: true

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --label-enable backpipe
